# Pipeline de dev: todo Pull Request hacia `dev`. Lint, tipos, migraciones,
# pruebas unitarias/seguridad/propiedades/integración y empaquetado del Worker.
# La auditoría de dependencias solo informa aquí; es obligatoria en main.
name: CI dev

on:
  pull_request:
    branches: [dev]

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      strict-audit: false
