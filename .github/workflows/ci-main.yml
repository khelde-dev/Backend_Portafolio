# Pipeline de main: Pull Requests hacia `main` (puerta de la release) y push.
# Mismos pasos que dev, con la auditoría de dependencias obligatoria.
#
# El deploy NO se hace aquí: lo hace la integración Git de Cloudflare (Workers
# Builds) al llegar un push a `main`. Por eso este pipeline es la única puerta
# antes de producción: configura la rama `main` para exigir que "CI main /
# checks" pase antes de mergear (Settings → Branches → Branch protection rules).
#
# IMPORTANTE (D1): el deploy NO aplica migraciones. Antes de mergear a main un
# cambio que toque `drizzle/`, aplícalo a la base remota a mano:
#   bun run db:migrate:remote
# y solo después deja que Cloudflare despliegue el código que las necesita.
name: CI main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      strict-audit: true

