version: 2
updates:
  # Dependencias de bun (package.json / bun.lock). Un PR a la semana, agrupado,
  # para no inundar dev; las alertas de seguridad llegan por su cuenta.
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Versiones de las acciones de GitHub usadas por los workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
